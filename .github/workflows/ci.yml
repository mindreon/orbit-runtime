name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/agentscope-migration-1c7d

jobs:
  commit-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cursor/agentscope-migration-1c7d'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/agentscope-migration-1c7d
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit assembled uv.lock at the repo root
        run: |
          cat uv.lock.parts/part-* > uv.lock
          sha256sum -c uv.lock.parts/SHA256SUMS
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already matches the assembled parts"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "build: commit assembled uv.lock [skip ci]"
          git push origin HEAD:cursor/agentscope-migration-1c7d

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # shellcheck is preinstalled on ubuntu-latest, so run: scripts are checked too.
      - name: actionlint (pinned)
        run: |
          curl -sSfL -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/control_db.py creates a database per run, applies the orbit-control migrations of ORBIT_CONTROL_DIR
      # and connects as orbit_worker. REQUIRE makes a missing database a failure, not a skip.
      ORBIT_TEST_POSTGRES_URL: postgresql://orbit:orbit@localhost:5432/orbit
      ORBIT_CONTROL_DIR: ${{ github.workspace }}/.orbit-control
      ORBIT_REQUIRE_PG_TESTS: "1"
    steps:
      # Full history for the gitleaks history scan.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # The schema and grants the worker runs against (migration 00018 grants the maintenance writes). Keep this SHA equal
      # to the orbit-control pin of orbit-infra.
      - uses: actions/checkout@v4
        with:
          repository: mindreon/orbit-control
          ref: ba24aaf93d9c6826f593557e23c2e42e8480b9aa
          path: .orbit-control
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble uv.lock
        run: |
          cat uv.lock.parts/part-* > uv.lock
          sha256sum -c uv.lock.parts/SHA256SUMS
      - run: uv sync --frozen
      - run: uv run python -m orbit_contracts.schema_export
      - run: git diff --exit-code schema
      - run: uv run lint-imports
      - run: uv run ruff check packages tests
      - run: uv run pytest
      # The full stack (Temporal, control, Postgres, MinIO, web) is exercised by orbit-web's `pnpm test:stack`.
      # .gitleaksignore lists single findings by fingerprint (commit:file:rule:line).
      - name: Secret scan of the repository and its full history
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          test "$(git rev-parse --is-shallow-repository)" = false
          /tmp/gitleaks git . --no-banner --redact

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mindreon/orbit-runtime:main
            ghcr.io/mindreon/orbit-runtime:${{ github.sha }}
