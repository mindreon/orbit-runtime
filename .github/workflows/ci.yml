name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/agentscope-migration-1c7d

jobs:
  commit-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cursor/agentscope-migration-1c7d'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/agentscope-migration-1c7d
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit assembled uv.lock at the repo root
        run: |
          cat uv.lock.parts/part-* > uv.lock
          sha256sum -c uv.lock.parts/SHA256SUMS
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already matches the assembled parts"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "build: commit assembled uv.lock [skip ci]"
          git push origin HEAD:cursor/agentscope-migration-1c7d

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORBIT_TEST_POSTGRES_URL: postgresql://orbit:orbit@localhost:5432/orbit
    steps:
      # The PR head itself, not the merge commit, so the E2E report names the head SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble uv.lock
        run: |
          cat uv.lock.parts/part-* > uv.lock
          sha256sum -c uv.lock.parts/SHA256SUMS
      - run: uv sync --frozen
      - run: uv run python -m orbit_contracts.schema_export
      - run: git diff --exit-code schema
      - run: uv run lint-imports
      - run: uv run ruff check packages tests scripts
      - run: uv run pytest
      - name: E2E A1 events and E-LOG-1..3, run 1 (real Temporal, orbit-orch, orbit-worker)
        run: uv run python scripts/e2e_a1_events.py run --out artifacts/e2e-a1-events.json --logs e2e-logs/run1
      - name: E2E A1 events and E-LOG-1..3, run 2 must match run 1
        run: |
          uv run python scripts/e2e_a1_events.py run --out e2e-rerun/e2e-a1-events.json --logs e2e-logs/run2
          cmp artifacts/e2e-a1-events.json e2e-rerun/e2e-a1-events.json
          cp e2e-rerun/e2e-a1-events.json artifacts/e2e-a1-events.rerun.json
      - name: Secret scan of the E2E reports and process logs
        run: |
          uv run python scripts/e2e_a1_events.py scan artifacts/e2e-a1-events.json artifacts/e2e-a1-events.rerun.json e2e-logs/run1/*.log e2e-logs/run2/*.log --out artifacts/e2e-a1-secret-scan.json
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir artifacts --no-banner --redact --report-format json --report-path /tmp/gitleaks.json
          cp /tmp/gitleaks.json artifacts/e2e-a1-gitleaks.json
          /tmp/gitleaks dir e2e-logs --no-banner --redact --report-format json --report-path /tmp/gitleaks-logs.json
          cp /tmp/gitleaks-logs.json artifacts/e2e-logs-gitleaks.json
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-a1-events
          path: artifacts/
          if-no-files-found: error
      # Full stdout and stderr of every orch and worker process; the step above scans them.
      - name: Upload E2E process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-process-logs
          path: e2e-logs/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mindreon/orbit-runtime:main
            ghcr.io/mindreon/orbit-runtime:${{ github.sha }}
