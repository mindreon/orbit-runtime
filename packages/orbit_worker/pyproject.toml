[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbit-worker"
version = "0.1.0"
description = "Orbit Activities and the AgentScope Framework adapter."
requires-python = ">=3.11"
dependencies = [
    "orbit-contracts",
    "temporalio>=1.11",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "agentscope==2.0.9",
    "asyncpg>=0.30",
    "cryptography>=42",
    "jsonschema>=4.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "minio>=7.2,<8",
    "opensandbox==0.1.16",
]

[project.scripts]
orbit-worker = "orbit_worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_worker"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
