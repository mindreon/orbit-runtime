[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbit-worker"
version = "0.1.0"
description = "Orbit Activities and the AgentScope Framework adapter."
requires-python = ">=3.11"
dependencies = [
    "orbit-contracts",
    "temporalio>=1.11",
    "agentscope==2.0.8",
]

[project.scripts]
orbit-worker = "orbit_worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_worker"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
